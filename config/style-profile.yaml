language: zh-CN
platform: X

voice:
  perspective: first_person
  personality:
    - curious
    - builder
    - reflective
    - ambitious
    - direct
    - authentic

preferences:
  natural_paragraphs: true
  preserve_original_idea: true
  prefer_specificity: true
  prefer_clear_argument: true
  allow_personal_experience: true
  allow_strong_opinion: true
  allow_counterintuitive_hook: true

avoid:
  one_sentence_per_paragraph: true
  excessive_line_breaks: true
  generic_ai_phrases: true
  fake_quotes: true
  invented_experience: true
  invented_data: true
  excessive_not_a_but_b: true
  motivational_cliche: true
  fake_depth: true
  forced_question_endings: true

format:
  paragraph_style: natural
  emoji: minimal
  hashtags: minimal
