[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thought-to-x"
version = "1.0.1"
description = "Turn messy thoughts into human-sounding X posts."
readme = "README_EN.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Thought-to-X contributors"}]
dependencies = ["PyYAML>=6.0"]
keywords = ["ai", "x", "twitter", "writing", "agent", "skill", "workflow"]

[project.optional-dependencies]
dev = []

[project.scripts]
thought-to-x = "thought_to_x.cli:main"

# Bundle the root skill assets without copying or changing their contents.
# The data-only namespace is used after a non-editable wheel installation.
[tool.setuptools]
packages = ["thought_to_x", "thought_to_x.providers", "thought_to_x._resources"]
package-dir = {"" = "src", "thought_to_x._resources" = "."}

[tool.setuptools.package-data]
"thought_to_x._resources" = ["SKILL.md", "prompts/*.md", "config/*.yaml", "workflows/*.md", "examples/*.md"]
